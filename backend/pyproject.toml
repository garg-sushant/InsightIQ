[project]
name = "insightiq-backend"
version = "1.0.0"
description = "InsightIQ — AI Business Analytics & Decision Support Platform (API)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TID", # tidy imports
]
ignore = [
    "B008",  # FastAPI dependency-injection defaults are function calls by design.
    "N818",  # Our exception names read better without a forced "Error" suffix.
]

[tool.ruff.lint.per-file-ignores]
"app/db/alembic/versions/*" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_unimported = false
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
exclude = ["app/db/alembic/versions/"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = [
    "sklearn.*",
    "pptx.*",
    "reportlab.*",
    "matplotlib.*",
    "openpyxl.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/alembic/*", "app/main.py"]
